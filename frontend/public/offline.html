<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#b91c1c" />
    <title>Lịch Việt — Ngoại tuyến</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: "Be Vietnam Pro", system-ui, sans-serif;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #faf7f0;
        color: #1c1917;
        padding: 24px;
      }
      .card {
        max-width: 420px;
        text-align: center;
        border: 1px solid #e7e0d5;
        border-radius: 20px;
        background: #fff;
        padding: 32px 24px;
        box-shadow: 0 12px 40px rgba(28, 25, 23, 0.08);
      }
      .mark {
        width: 64px;
        height: 64px;
        border-radius: 18px;
        background: #b91c1c;
        color: #fff;
        display: grid;
        place-items: center;
        font-weight: 700;
        margin: 0 auto 16px;
      }
      h1 {
        font-size: 20px;
        margin: 0 0 8px;
      }
      p {
        color: #78716c;
        line-height: 1.6;
        margin: 0 0 20px;
      }
      a {
        display: inline-block;
        background: #b91c1c;
        color: #fff;
        text-decoration: none;
        padding: 10px 20px;
        border-radius: 12px;
        font-weight: 600;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #17130f;
          color: #f5f0e8;
        }
        .card {
          background: #221d18;
          border-color: #3a322a;
        }
        p {
          color: #b8aea1;
        }
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="mark">Lịch</div>
      <h1>Đang ngoại tuyến</h1>
      <p>
        Không có kết nối mạng, nhưng lịch của bạn vẫn được lưu an toàn trên thiết bị. Hãy thử lại khi có mạng trở lại.
      </p>
      <a href="/">Mở lại Lịch Việt</a>
    </main>
  </body>
</html>
